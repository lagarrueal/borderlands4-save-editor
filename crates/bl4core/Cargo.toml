[package]
name = "bl4core"
version.workspace = true
edition.workspace = true

[dependencies]
aes = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
